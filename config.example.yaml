# Subscription Usage Panel — scalable config
# Designed for many networks × many homes (e.g. 20 families × 100 profiles).

interval: 60
timeout_s: 8
workers: 16          # parallel fetches (raise toward 32–64 for huge fleets)
show_dead: true
only_live: false     # true = emit Status.LIVE profiles only in every output mode
auto_discover: true  # scan ~ using panel/catalog.yaml
theme: dark          # dark | light

# Optional filters (also CLI: --family codex --profile codex-work --only-live)
# families: [claude, codex, grok, gemini, kimi]
# profiles_filter: [codex-work, grok-personal]

# Curated mode: set auto_discover: false and keep only current subscriptions
# in this explicit allowlist. Remove or disable a profile when its subscription ends.
# With only_live: false, a current subscription stays visible when its quota API
# is temporarily unavailable; the panel shows the auth/error reason, never fake limits.
# With discovery enabled, explicit profiles merge with discovery (same home wins).
# profiles:
#   - id: codex-work
#     family: codex
#     label: CODEX/work
#     home: ~/.codex-work
#     enabled: true

# Optional RGB overrides for terminal colors
# colors:
#   codex: "175;130;190"
