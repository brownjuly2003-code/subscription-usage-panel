# Subscription Usage Panel — scalable config
# Designed for many networks × many homes (e.g. 20 families × 100 profiles).

interval: 60
timeout_s: 8
workers: 16          # parallel fetches (raise toward 32–64 for huge fleets)
show_dead: true
only_live: false
auto_discover: true  # scan ~ using panel/catalog.yaml
theme: dark          # dark | light

# Optional filters (also CLI: --family codex --profile codex-work --only-live)
# families: [claude, codex, grok, gemini, kimi]
# profiles_filter: [codex-work, grok-personal]

# Explicit profiles merge with discovery (same home → explicit wins)
# profiles:
#   - id: codex-work
#     family: codex
#     label: CODEX/work
#     home: ~/.codex-work
#     enabled: true

# Optional RGB overrides for terminal colors
# colors:
#   codex: "175;130;190"
